server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: BITCOMSESSION
        path: ${SESSION_COOKIE_PATH:/}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  background-check:
    base-url: ${BACKGROUND_CHECK_API_URL:https://54capvm12g.execute-api.ap-northeast-2.amazonaws.com}
    connect-timeout: 3s
    read-timeout: 7s
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    employee-email: ${SEED_EMPLOYEE_EMAIL:}
    employee-password: ${SEED_EMPLOYEE_PASSWORD:}
    terminated-email: ${SEED_TERMINATED_EMAIL:}
    terminated-password: ${SEED_TERMINATED_PASSWORD:}
