spring:
  datasource:
    url: jdbc:h2:mem:portal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  main:
    allow-bean-definition-overriding: true

app:
  seed:
    enabled: false
  background-check:
    base-url: http://127.0.0.1:1
    connect-timeout: 1s
    read-timeout: 1s
