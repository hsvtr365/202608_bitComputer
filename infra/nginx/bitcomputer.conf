# /etc/nginx/sites-enabled/jujeop.com 의 HTTPS server 블록 안에 추가할 설정.
# 아직 서버에는 적용하지 않는다.

location = /bitComProject {
    return 301 /bitComProject/;
}

location ^~ /bitComProject/api/ {
    proxy_pass http://127.0.0.1:8081/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /bitComProject/ {
    root /var/www/bitcomputer;
    try_files $uri $uri/ /bitComProject/index.html;
}
