# /etc/nginx/sites-enabled/jujeop.com 의 HTTPS server 블록 안에 추가할 설정.
# 아직 서버에는 적용하지 않는다.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

location = /bitComProject {
    return 301 /bitComProject/;
}

location ^~ /bitComProject/api/ {
    proxy_pass http://127.0.0.1:8081/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /bitComProject/ {
    root /var/www/bitcomputer;
    try_files $uri $uri/ /bitComProject/index.html;
}
